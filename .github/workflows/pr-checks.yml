name: Pull Request Checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run data:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
